<div class="w-[280px] h-full bg-white border-r border-black/5 flex flex-col py-8 px-5">

    <div class="flex items-center gap-3 mb-10 pl-2">
        <div
            class="w-[45px] h-[45px] bg-brand-medium rounded-full border-2 border-brand-light flex items-center justify-center text-white font-bold text-xl overflow-hidden shrink-0">
            <span>{{ currentAssociation?.nameAssociation?.charAt(0)?.toUpperCase() || '?' }}</span>
        </div>

        <span class="text-xl font-extrabold text-brand-dark tracking-tight truncate">
            {{ currentAssociation?.nameAssociation || 'Cargando...' }}
        </span>
    </div>

    <nav class="flex-1 flex flex-col gap-2">

        <a (click)="changeActive('perfil')"
            [class]="activeView === 'perfil' ? 'bg-brand-light text-brand-dark font-bold shadow-sm translate-x-1' : 'text-brand-dark hover:bg-brand-light hover:translate-x-1'"
            class="flex items-center gap-4 py-3 px-4 rounded-2xl transition-all duration-200 cursor-pointer group select-none">
            <i data-lucide="user" class="w-5 h-5 stroke-[2]"></i>
            <span>Mi Perfil</span>
        </a>

        <a (click)="changeActive('publicaciones')"
            [class]="activeView === 'publicaciones' ? 'bg-brand-light text-brand-dark font-bold shadow-sm translate-x-1' : 'text-brand-dark hover:bg-brand-light hover:translate-x-1'"
            class="flex items-center gap-4 py-3 px-4 rounded-2xl transition-all duration-200 cursor-pointer group select-none">
            <i data-lucide="layout-list" class="w-5 h-5 stroke-[2]"></i>
            <span>Mis publicaciones</span>
        </a>

        <a (click)="changeActive('citas')"
            [class]="activeView === 'citas' ? 'bg-brand-light text-brand-dark font-bold shadow-sm translate-x-1' : 'text-brand-dark hover:bg-brand-light hover:translate-x-1'"
            class="flex items-center gap-4 py-3 px-4 rounded-2xl transition-all duration-200 cursor-pointer group select-none">
            <i data-lucide="calendar-check" class="w-5 h-5 stroke-[2]"></i>
            <span>Citas programadas</span>
        </a>


        <button (click)="onLogout()"
            class="mt-auto flex items-center gap-4 py-3 px-4 rounded-2xl text-[#D67D7D] font-medium transition-all duration-200 hover:bg-[#FFF0F0] hover:text-[#B24C4C] hover:translate-x-1 cursor-pointer w-full text-left">
            <i data-lucide="log-out" class="w-5 h-5 stroke-[2]"></i>
            <span>Hasta Pronto</span>
        </button>

    </nav>
</div>
