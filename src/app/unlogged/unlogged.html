
<div class="bg-white/50bg-brand-cream text-gray-800 font-sans overflow-hidden">
    <div class="flex h-screen w-full">

        <aside
            class="w-20 md:w-24 flex-none bg-white/50 border-r border-brand-medium/20 flex flex-col items-center py-6 h-full z-20">

            <div class="mb-6 p-2 rounded-full hover:bg-brand-light/50 cursor-pointer transition">
                <div class="w-8 h-8 bg-brand-dark rounded-full"></div>
            </div>

            <div class="flex-1 w-full flex flex-col items-center gap-4">
                <app-aside class="flex flex-col gap-4 items-center w-full">
                    <div
                        class="w-10 h-10 rounded-xl bg-brand-medium/20 hover:bg-brand-medium/40 transition cursor-pointer">
                    </div>
                    <div
                        class="w-10 h-10 rounded-xl bg-brand-medium/20 hover:bg-brand-medium/40 transition cursor-pointer">
                    </div>
                </app-aside>
            </div>

            <div class="mt-auto p-2">
                <div class="w-8 h-8 rounded-full bg-gray-300"></div>
            </div>
        </aside>


        <main class="flex-1 flex flex-col min-w-0 relative">

            <nav
                class="sticky top-0 z-30 w-full bg-brand-cream/95 backdrop-blur-sm px-4 py-4 md:px-6 flex items-center gap-4 shadow-sm md:shadow-none">

                <div class="relative shrink-0">
                    <select (change)="setcategory($event)"
                        class="appearance-none bg-transparent font-semibold text-brand-dark py-2 pl-3 pr-8 rounded-full hover:bg-black/5 cursor-pointer focus:outline-none transition-colors">
                        <option value="publicaciones">Publicaciones</option>
                        <option value="asociaciones">Asociaciones</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-brand-dark">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
                        </svg>
                    </div>
                </div>

                <div class="flex-1 max-w-4xl mx-auto">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-brand-dark/70 group-focus-within:text-brand-dark" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <input (input)="filterSearch($event)" type="text"
                            class="block w-full bg-brand-light/30 text-gray-900 rounded-full py-3 pl-12 pr-4 placeholder-brand-dark/70 focus:outline-none focus:ring-2 focus:ring-brand-medium/50 focus:bg-white transition-all shadow-inner"
                            placeholder="Search...">
                    </div>
                </div>

                <div class="shrink-0 flex items-center gap-2">
                    <button (click)="setModalLoginTrue()"
                        class="bg-brand-dark text-white font-bold py-2 px-6 rounded-full hover:bg-opacity-90 transition transform active:scale-95 cursor-pointer hover:shadow-[6px_6px_20px_-2px] hover:shadow-brand-medium/20 hover:-translate-y-1 transition-all duration-300">
                        Log in
                    </button>
                </div>
            </nav>


            <div class="flex-1 overflow-y-auto no-scrollbar p-4 md:p-6">
                <app-main [searchterm]="getSearch()" [category]="getcategory()" class="block w-full h-full">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 pb-20">
                        <div class="h-64 rounded-2xl bg-brand-light/40"></div>
                        <div class="h-96 rounded-2xl bg-brand-medium/30"></div>
                        <div class="h-72 rounded-2xl bg-brand-dark/20"></div>
                        <div class="h-80 rounded-2xl bg-white shadow-sm border border-brand-light"></div>
                        <div class="h-60 rounded-2xl bg-brand-medium/30"></div>
                        <div class="h-80 rounded-2xl bg-brand-light/40"></div>
                    </div>
                </app-main>
            </div>

        </main>
    </div>

</div>

@if (showLogin) {
<app-login (close)="setModalLoginFalse()" (categoryLogged)="setLoggedPage($event)"></app-login>
}
