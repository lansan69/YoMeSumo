<div [ngSwitch]="userStatus">

  <app-unlogged *ngSwitchCase="'unlogged'" (category)="setUserstatus($event)"></app-unlogged>

  <app-asociacion *ngSwitchCase="'asociacion'" (logout)="logOut()" ></app-asociacion>

  <app-ayudante *ngSwitchCase="'usuario'" (logout)="logOut()" ></app-ayudante>

  <p *ngSwitchDefault>Please log in to continue.</p>

</div>
